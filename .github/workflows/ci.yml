name: Phase 2 quality pipeline

on:
  push:
    branches: [dev, qa, main]
  pull_request:
    branches: [dev, qa, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and syntax validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate backend syntax
        run: python -m compileall -q backend
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: wlms-frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: wlms-frontend
        run: npm ci
      - name: Build frontend
        working-directory: wlms-frontend
        env:
          VITE_API_BASE_URL: https://example.invalid
        run: npm run build

  unit-tests:
    name: Unit tests and coverage
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install backend test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run backend unit tests
        env:
          SECRET_KEY: ci-only-test-secret
        run: python -m pytest --cov=backend --cov-report=term-missing --cov-report=xml:coverage-backend.xml
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: wlms-frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: wlms-frontend
        run: npm ci
      - name: Run frontend unit tests
        working-directory: wlms-frontend
        run: npm run test:coverage
      - name: Upload coverage reports
        uses: actions/upload-artifact@v6
        with:
          name: coverage-reports
          path: |
            coverage-backend.xml
            wlms-frontend/coverage/lcov.info
          retention-days: 14

  static-analysis:
    name: SonarCloud analysis and quality gate
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Download coverage reports
        uses: actions/download-artifact@v7
        with:
          name: coverage-reports
      - name: Run SonarCloud analysis
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

  api-tests:
    name: Postman API tests
    needs: static-analysis
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Warm up Azure API
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: >
          curl --fail --silent --show-error
          --retry 5 --retry-all-errors --retry-delay 5
          --max-time 90 --output /dev/null
          "$API_BASE_URL/"
      - name: Run 15 API requests with Newman
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          API_TEST_USERNAME: ${{ secrets.API_TEST_USERNAME }}
          API_TEST_PASSWORD: ${{ secrets.API_TEST_PASSWORD }}
        run: >
          npx --yes newman@6 run postman/WLMS-Phase2.postman_collection.json
          --env-var "baseUrl=$API_BASE_URL"
          --env-var "username=$API_TEST_USERNAME"
          --env-var "password=$API_TEST_PASSWORD"
          --reporters cli,junit
          --reporter-junit-export newman/results.xml
      - name: Upload Newman report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: newman-results
          path: newman/results.xml
          retention-days: 14

  deploy-ready:
    name: Deployment gate
    needs: api-tests
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'qa' }}
    steps:
      - name: Confirm validated artifact
        run: echo "Build, unit tests, quality gate, and API tests passed for $GITHUB_REF_NAME."

  deploy:
    name: Deploy to Azure
    needs: deploy-ready
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.STATIC_WEB_APP_URL }}
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Verify deployment configuration
        env:
          AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          STATIC_WEB_APP_URL: ${{ vars.STATIC_WEB_APP_URL }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_STATIC_WEB_APPS_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          missing=0
          for name in AZURE_WEBAPP_NAME API_BASE_URL STATIC_WEB_APP_URL AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_STATIC_WEB_APPS_API_TOKEN; do
            if [ -z "${!name}" ]; then echo "::error::Missing $name in the production environment"; missing=1; fi
          done
          exit $missing
      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Package backend
        run: >
          zip -r backend-package.zip requirements.txt backend
          -x "backend/.env" "*/__pycache__/*" "*.pyc"
      - name: Deploy backend to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: backend-package.zip
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: wlms-frontend/package-lock.json
      - name: Build frontend for production
        working-directory: wlms-frontend
        env:
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          npm ci
          npm run build
      - name: Deploy frontend to Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: wlms-frontend/dist
          output_location: ""
          skip_app_build: true
          skip_api_build: true
      - name: Smoke test deployed services
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          STATIC_WEB_APP_URL: ${{ vars.STATIC_WEB_APP_URL }}
        run: |
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 15 --max-time 120 "$API_BASE_URL/" --output /dev/null
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 10 --max-time 120 "$API_BASE_URL/openapi.json" --output /dev/null
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 5 --max-time 60 "$STATIC_WEB_APP_URL/" --output /dev/null
