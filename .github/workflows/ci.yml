name: CI

on:
  push:
    branches: [dev, qa, main]
  pull_request:
    branches: [dev, qa, main]

permissions:
  contents: read

jobs:
  backend-unit-tests:
    name: Backend unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install backend dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run backend unit tests
        env:
          SECRET_KEY: ci-only-test-secret
        run: python -m pytest --cov=backend --cov-report=term-missing --cov-report=xml:coverage-backend.xml

  frontend-unit-tests:
    name: Frontend unit tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wlms-frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: wlms-frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend unit tests
        run: npm run test:coverage

      - name: Build frontend
        env:
          VITE_API_BASE_URL: https://example.invalid
        run: npm run build

